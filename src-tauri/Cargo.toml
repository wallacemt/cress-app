[package]
name = "cress"
version = "0.1.0"
description = "Cress musical practice desktop app"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cress_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = [] }
tauri-plugin-sql = { version = "2.5.0", features = ["sqlite"] }
tauri-plugin-log = "2.10.0"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
cpal = "=0.18.2"
rtrb = "0.4.0"
hound = "3.5.1"
sha2 = "0.11.0"
uuid = { version = "1.27.0", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
log = "0.4.34"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
